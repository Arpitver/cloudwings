    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const colors = type === 'success'
        ? 'bg-emerald-600 text-white border-emerald-400/40'
        : type === 'error'
          ? 'bg-red-600 text-white border-red-400/40'
          : 'bg-cw-navy text-white border-cw-sky/30';
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl border text-sm font-medium flex items-center gap-2.5 transition-all duration-300 ${colors}`;
      el.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '!' : '✦'}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 300);
      }, 3800);
    }

    /* =====================================================================
       9. STRICT CONTACT FORM VALIDATION & LEAD SUBMISSION
       ===================================================================== */
    function handleContactLeadSubmit(e) {
      e.preventDefault();
      const fullName = document.getElementById('leadName').value.trim();
      const email = document.getElementById('leadEmail').value.trim();
      const phoneInput = document.getElementById('leadPhone').value.trim();
      const company = document.getElementById('leadCompany').value.trim();
      const requiredServices = document.getElementById('leadService').value;
      const projectDescription = document.getElementById('leadBrief').value.trim();

      // Strict phone validation: must not be empty, must not contain alphabetical letters, and must have at least 10 valid digits
      if (!phoneInput) {
        showToast('Phone number is strictly required.', 'error');
        document.getElementById('leadPhone').focus();
        return;
      }
      // Check for alphabetic characters in phone field
      if (/[a-zA-Z]/.test(phoneInput)) {
        showToast('Phone number cannot contain letters. Please enter a valid phone number.', 'error');
        document.getElementById('leadPhone').focus();
        return;
      }
      // Extract digits to verify minimum length
      const digitsOnly = phoneInput.replace(/\D/g, '');
      if (digitsOnly.length < 10) {
        showToast('Please enter a valid 10-digit mobile number.', 'error');
        document.getElementById('leadPhone').focus();
        return;
      }

      const newLead = {
        id: 'LEAD-' + (1001 + cmsData.leads.length),
        fullName,
        email,
        phone: phoneInput,
        company,
        requiredServices,
        projectDescription,
        status: 'New',
        submittedAt: new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
      };

      cmsData.leads.unshift(newLead);
      saveCmsData();
      e.target.reset();
      showToast('Enquiry received successfully! Saved to CloudWings Lead CRM.', 'success');
    }

    function handleNewsletterSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('footerNewsletterEmail');
      const email = input.value.trim().toLowerCase();
      if (!email) return;
      cmsData.subscribers.unshift({
        id: 'SUB-' + String(cmsData.subscribers.length + 1).padStart(2, '0'),
        email,
        subscribedAt: new Date().toISOString().slice(0, 10)
      });
      saveCmsData();
      input.value = '';
      showToast('Subscribed to CloudWings Insights!', 'success');
    }
